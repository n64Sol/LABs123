        - challengerUserId
        - opponentUserId
        - challenger
        - opponent
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, active, completed, declined, cancelled]
        version:
          type: integer
        role:
          type: string
          enum: [challenger, opponent]
        challengerUserId:
          type: integer
        opponentUserId:
          type: integer
        challenger:
          $ref: "#/components/schemas/DuelParticipant"
        opponent:
          $ref: "#/components/schemas/DuelParticipant"
        result:
          $ref: "#/components/schemas/DuelResult"
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string

    DuelResponse:
      type: object
      required: [duel]
      properties:
        duel:
          $ref: "#/components/schemas/Duel"
          nullable: true

    ChallengeDuelInput:
      type: object
      required: [targetUserId]
      properties:
        targetUserId:
          type: integer
        spriteLayers:
          type: object
          additionalProperties:
            type: string

    AcceptDuelInput:
      type: object
      properties:
        spriteLayers:
          type: object
          additionalProperties:
            type: string

    RecentDuel:
      type: object
      required:
        - id
        - outcome
        - opponentUserId
        - opponentName
        - opponentAvatarUrl
        - durationMs
        - resolvedAt
      properties:
        id:
          type: integer
        outcome:
          type: string
          enum: [win, loss]
        opponentUserId:
          type: integer
        opponentName:
          type: string
        opponentAvatarUrl:
          type: string
        durationMs:
          type: integer
        resolvedAt:
          type: string

    DuelRecord:
      type: object
      required: [wins, losses, total, winRate, recent]
      properties:
        wins:
          type: integer
        losses:
          type: integer
        total:
          type: integer
        winRate:
          type: integer
        recent:
          type: array
          items:
            $ref: "#/components/schemas/RecentDuel"
