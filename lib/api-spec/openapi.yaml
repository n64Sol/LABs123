openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Labyrinths — server-authoritative high-fantasy dungeon economy game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Robinhood Chain wallet authentication and player session
  - name: labyrinths
    description: Claim, configure, publish, and browse labyrinths
  - name: upgrades
    description: Chamber and labyrinth upgrades
  - name: rooms
    description: Room-type pool unlocks that shape the dungeon
  - name: tollgate
    description: Toll Gate paid-entry configuration
  - name: runs
    description: Running labyrinths, combat completion, and ratings
  - name: economy
    description: Treasury, owner earnings, ledger, and activity
  - name: discovery
    description: Featured, trending, leaderboard, and world stats
  - name: items
    description: Item templates, inventory, loadout, and crafting
  - name: robinhood
    description: Robinhood Chain network and custodial settlement status
  - name: marketplace
    description: USDC marketplace — list, browse, buy, and cancel item listings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/mock-wallets:
    get:
      operationId: listMockWallets
      tags: [auth]
      summary: List development-only wallet fixtures
      responses:
        "200":
          description: Mock wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MockWallet"

  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Get the configured Robinhood Chain network and settlement settings
      responses:
        "200":
          description: Robinhood Chain configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /auth/challenge:
    post:
      operationId: requestAuthChallenge
      tags: [auth]
      summary: Request a sign-in nonce for an EVM wallet on Robinhood Chain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthChallengeInput"
      responses:
        "200":
          description: Challenge issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthChallenge"

  /auth/verify:
    post:
      operationId: verifyAuthChallenge
      tags: [auth]
      summary: Verify an EVM-signed challenge and establish a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthVerifyInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "401":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      operationId: getCurrentPlayer
      tags: [auth]
      summary: Get the currently authenticated player
      responses:
        "200":
          description: Current player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Clear the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"

  /balances:
    get:
      operationId: getBalances
      tags: [auth]
      summary: Get the current player's currency and material balances
      responses:
        "200":
          description: Balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balances"

  /labyrinths:
    get:
      operationId: listLabyrinths
      tags: [labyrinths]
      summary: Browse the published overworld of labyrinths
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [trending, top_rated, newest, most_run, highest_reward]
        - name: entry
          in: query
          required: false
          schema:
            type: string
            enum: [all, free, paid]
        - name: biome
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Published labyrinths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Labyrinth"

  /labyrinths/claim:
    post:
      operationId: claimLabyrinth
      tags: [labyrinths]
      summary: Claim a fresh labyrinth for the current player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabyrinthClaimInput"
      responses:
        "201":
          description: Claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Labyrinth"
        "409":
          description: Player already owns a labyrinth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /labyrinths/mine:
    get:
      operationId: getMyLabyrinth
      tags: [labyrinths]
      summary: Get the current player's owned labyrinth
      responses:
        "200":
          description: Owned labyrinth (null if none claimed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabyrinthOrNull"

  /labyrinths/{id}:
    get:
      operationId: getLabyrinth
      tags: [labyrinths]
      summary: Get a labyrinth by id
      parameters:
        - $ref: "#/components/parameters/LabyrinthId"
      responses:
        "200":
          description: Labyrinth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Labyrinth"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateLabyrinth
      tags: [labyrinths]
      summary: Update labyrinth name, description, or theme
      parameters:
        - $ref: "#/components/parameters/LabyrinthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabyrinthUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Labyrinth"

  /labyrinths/{id}/preview:
    get:
      operationId: getLabyrinthPreview
      tags: [labyrinths]
      summary: Get a rich preview (chambers, loot table, difficulty) before running
      parameters:
        - $ref: "#/components/parameters/LabyrinthId"
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabyrinthPreview"

  /labyrinths/{id}/publish:
    post:
      operationId: publishLabyrinth
      tags: [labyrinths]
      summary: Publish a labyrinth to the overworld
      parameters:
        - $ref: "#/components/parameters/LabyrinthId"
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Labyrinth"

  /labyrinths/{id}/unpublish:
    post:
      operationId: unpublishLabyrinth
      tags: [labyrinths]
      summary: Remove a labyrinth from the overworld
      parameters:
        - $ref: "#/components/parameters/LabyrinthId"
      responses:
        "200":
          description: Unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Labyrinth"

  /labyrinths/{id}/ratings:
    get:
      operationId: listLabyrinthRatings
      tags: [labyrinths]
      summary: List ratings for a labyrinth
      parameters:
        - $ref: "#/components/parameters/LabyrinthId"
      responses:
        "200":
          description: Ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rating"

  /upgrades:
    get:
      operationId: listUpgradeCatalog
      tags: [upgrades]
      summary: List the full upgrade catalog
      responses:
        "200":
          description: Upgrade catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpgradeCatalogItem"

  /labyrinths/{id}/upgrades:
    get:
      operationId: listLabyrinthUpgrades
      tags: [upgrades]
      summary: List upgrades purchased for a labyrinth
      parameters:
        - $ref: "#/components/parameters/LabyrinthId"
      responses:
        "200":
          description: Purchased upgrades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LabyrinthUpgrade"
    post:
      operationId: buyLabyrinthUpgrade
      tags: [upgrades]
      summary: Purchase or level up an upgrade for a labyrinth
      parameters:
        - $ref: "#/components/parameters/LabyrinthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradePurchaseInput"
      responses:
        "200":
          description: Upgrade purchased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradePurchaseResult"
        "402":
          description: Insufficient funds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /labyrinths/{id}/room-types:
    get:
      operationId: listRoomTypes
      tags: [rooms]
      summary: List the room-type catalog with this labyrinth's unlock state
      parameters:
        - $ref: "#/components/parameters/LabyrinthId"
      responses:
        "200":
          description: Room-type catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomType"

  /labyrinths/{id}/room-types/unlock:
    post:
      operationId: unlockRoomType
      tags: [rooms]
      summary: Unlock a room type with gold to expand the dungeon's pool
      parameters:
        - $ref: "#/components/parameters/LabyrinthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUnlockInput"
      responses:
        "200":
          description: Room type unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomUnlockResult"
        "402":
          description: Insufficient funds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /labyrinths/{id}/toll-gate/suggested-fee:
    get:
      operationId: getSuggestedFee
      tags: [tollgate]
      summary: Get appeal score and suggested entry fee range
      parameters:
        - $ref: "#/components/parameters/LabyrinthId"
      responses:
        "200":
          description: Suggested fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestedFee"

  /labyrinths/{id}/toll-gate/unlock:
    post:
      operationId: unlockTollGate
      tags: [tollgate]
      summary: Unlock the Toll Gate to enable paid entry
      parameters:
        - $ref: "#/components/parameters/LabyrinthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdempotentInput"
      responses:
        "200":
          description: Toll Gate unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradePurchaseResult"
        "402":
          description: Insufficient funds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /labyrinths/{id}/toll-gate/fee:
    patch:
      operationId: setTollGateFee
      tags: [tollgate]
      summary: Set the paid entry fee for a labyrinth
      parameters:
        - $ref: "#/components/parameters/LabyrinthId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TollGateFeeInput"
      responses:
        "200":
          description: Fee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Labyrinth"

  /runs:
    post:
      operationId: startRun
      tags: [runs]
      summary: Start a run of a labyrinth (handles free, paid, and owner self-run)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStartInput"
      responses:
        "201":
          description: Run started, includes playable chamber layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "402":
          description: Insufficient funds for paid entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/mine:
    get:
      operationId: listMyRuns
      tags: [runs]
      summary: List the current player's run history
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"

  /runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get a run by id
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/complete:
    post:
      operationId: completeRun
      tags: [runs]
      summary: Complete a run; server rolls loot and settles the economy
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCompleteInput"
      responses:
        "200":
          description: Run settled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummary"

  /runs/{id}/rate:
    post:
      operationId: rateRun
      tags: [runs]
      summary: Rate a completed run's labyrinth
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingInput"
      responses:
        "201":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"

  /economy/treasury:
    get:
      operationId: getTreasury
      tags: [economy]
      summary: Get global treasury status
      responses:
        "200":
          description: Treasury
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Treasury"

  /economy/owner-earnings:
    get:
      operationId: getOwnerEarnings
      tags: [economy]
      summary: Get the current owner's pending and lifetime earnings
      responses:
        "200":
          description: Owner earnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerEarnings"

  /economy/collect:
    post:
      operationId: collectEarnings
      tags: [economy]
      summary: Collect pending owner earnings into the wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdempotentInput"
      responses:
        "200":
          description: Collected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectResult"

  /economy/ledger:
    get:
      operationId: getLedger
      tags: [economy]
      summary: Get the current player's economy ledger entries
      responses:
        "200":
          description: Ledger
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntry"

  /activity:
    get:
      operationId: getActivityFeed
      tags: [economy]
      summary: Global recent activity feed
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"

  /activity/mine:
    get:
      operationId: getMyActivity
      tags: [economy]
      summary: Current player's activity feed
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"

  /discovery/featured:
    get:
      operationId: getFeaturedLabyrinths
      tags: [discovery]
      summary: Hand-picked featured labyrinths
      responses:
        "200":
          description: Featured
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Labyrinth"

  /discovery/trending:
    get:
      operationId: getTrendingLabyrinths
      tags: [discovery]
      summary: Trending labyrinths by recent run volume
      responses:
        "200":
          description: Trending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Labyrinth"

  /discovery/top-paid:
    get:
      operationId: getTopPaidLabyrinths
      tags: [discovery]
      summary: Top earning paid labyrinths
      responses:
        "200":
          description: Top paid
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Labyrinth"

  /discovery/top-free:
    get:
      operationId: getTopFreeLabyrinths
      tags: [discovery]
      summary: Top rated free labyrinths
      responses:
        "200":
          description: Top free
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Labyrinth"

  /discovery/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [discovery]
      summary: Top owners ranked by lifetime earnings
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /discovery/world-stats:
    get:
      operationId: getWorldStats
      tags: [discovery]
      summary: Global world statistics
      responses:
        "200":
          description: World stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldStats"

  /items/templates:
    get:
      operationId: listItemTemplates
      tags: [items]
      summary: List all item templates
      responses:
        "200":
          description: Item templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemTemplate"

  /items/mine:
    get:
      operationId: listMyItems
      tags: [items]
      summary: List the current player's inventory
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerItem"

  /items/{id}/upgrade:
    post:
      operationId: upgradePlayerItem
      tags: [items]
      summary: Spend materials to level up an owned item
      parameters:
        - $ref: "#/components/parameters/PlayerItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdempotentInput"
      responses:
        "200":
          description: Item upgraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemMutationResult"
        "402":
          description: Insufficient materials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /items/bulk-dispose:
    post:
      operationId: bulkDisposeItems
      tags: [items]
      summary: Bulk sell (for gold) or scrap (for materials) unequipped items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDisposeInput"
      responses:
        "200":
          description: Items disposed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDisposeResult"
        "400":
          description: No eligible items or invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /loadout:
    get:
      operationId: getLoadout
      tags: [items]
      summary: Get the current player's 7-slot loadout and derived combat stats
      responses:
        "200":
          description: Loadout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loadout"

  /loadout/equip:
    post:
      operationId: equipItem
      tags: [items]
      summary: Equip an item into its slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipInput"
      responses:
        "200":
          description: Loadout updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loadout"

  /loadout/unequip:
    post:
      operationId: unequipSlot
      tags: [items]
      summary: Unequip an item from a slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnequipInput"
      responses:
        "200":
          description: Loadout updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loadout"

  /crafting/recipes:
    get:
      operationId: listCraftingRecipes
      tags: [items]
      summary: List all crafting recipes
      responses:
        "200":
          description: Recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CraftingRecipe"

  /crafting/craft:
    post:
      operationId: craftItem
      tags: [items]
      summary: Craft an item from a recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CraftInput"
      responses:
        "200":
          description: Crafted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemMutationResult"
        "402":
          description: Insufficient materials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chain/transactions:
    get:
      operationId: listChainTransactions
      tags: [robinhood]
      summary: List Robinhood Chain settlement records
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChainTransaction"

  /chain/status:
    get:
      operationId: getChainStatus
      tags: [robinhood]
      summary: Get Robinhood Chain connection and settlement status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainStatus"

  /trade/active:
    get:
      operationId: getActiveTrade
      tags: [trade]
      summary: The caller's current (or most recent terminal) trade session, if any
      responses:
        "200":
          description: Active trade or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeActiveEnvelope"

  /trade/invite:
    post:
      operationId: inviteTrade
      tags: [trade]
      summary: Invite an encountered player to trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInviteInput"
      responses:
        "200":
          description: Pending trade created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeEnvelope"
        "409":
          description: A participant is already trading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /trade/{id}/respond:
    post:
      operationId: respondTrade
      tags: [trade]
      summary: Accept or decline a pending trade invite
      parameters:
        - $ref: "#/components/parameters/TradeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeRespondInput"
      responses:
        "200":
          description: Updated trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeEnvelope"
        "400":
          description: Invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /trade/{id}/offer:
    post:
      operationId: updateTradeOffer
      tags: [trade]
      summary: Stage this participant's full offer (replaces prior); resets confirmations
      parameters:
        - $ref: "#/components/parameters/TradeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeOfferInput"
      responses:
        "200":
          description: Updated trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeEnvelope"
        "400":
          description: Invalid offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /trade/{id}/confirm:
    post:
      operationId: confirmTrade
      tags: [trade]
      summary: Toggle the caller's confirmation; settles atomically when both confirm
      parameters:
        - $ref: "#/components/parameters/TradeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeConfirmInput"
      responses:
        "200":
          description: Updated trade (possibly settled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeEnvelope"
        "400":
          description: Invalid confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /trade/{id}/cancel:
    post:
      operationId: cancelTrade
      tags: [trade]
      summary: Cancel a trade, returning everything
      parameters:
        - $ref: "#/components/parameters/TradeId"
      responses:
        "200":
          description: Cancelled trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeEnvelope"
        "400":
          description: Could not cancel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /marketplace:
    get:
      operationId: listMarketplaceListings
      tags: [marketplace]
      summary: Browse active marketplace listings
      responses:
        "200":
          description: Active listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceListing"

  /marketplace/mine:
    get:
      operationId: listMyMarketplaceListings
      tags: [marketplace]
      summary: The current player's active listings
      responses:
        "200":
          description: Your active listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceListing"

  /marketplace/deposit:
    post:
      operationId: depositUsdc
      tags: [marketplace]
      summary: Mock USDC on-ramp — credit test USDC to the player's balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsdcDepositInput"
      responses:
        "200":
          description: USDC credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsdcDepositResult"
        "400":
          description: Invalid amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /marketplace/list:
    post:
      operationId: createMarketplaceListing
      tags: [marketplace]
      summary: List an owned, unequipped item for sale in USDC (escrows the item)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingInput"
      responses:
        "200":
          description: Listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateListingResult"
        "400":
          description: Invalid request (e.g. equipped item or bad price)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Item already listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /marketplace/{id}/cancel:
    post:
      operationId: cancelMarketplaceListing
      tags: [marketplace]
      summary: Cancel an active listing and return the item from escrow
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdempotentInput"
      responses:
        "200":
          description: Listing cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelListingResult"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Listing no longer active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /marketplace/{id}/buy:
    post:
      operationId: buyMarketplaceListing
      tags: [marketplace]
      summary: Buy an active listing with USDC (settles and transfers the item)
      parameters:
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdempotentInput"
      responses:
        "200":
          description: Purchase complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyListingResult"
        "400":
          description: Cannot buy your own listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Insufficient USDC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Listing no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /coop/party:
    get:
      operationId: getCoopParty
      tags: [coop]
      summary: Get the caller's current co-op party (or null)
      responses:
        "200":
          description: Current party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartyResponse"

  /coop/parties:
    post:
      operationId: createCoopParty
      tags: [coop]
      summary: Create a co-op party for a labyrinth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCoopPartyInput"
      responses:
        "201":
          description: Party created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartyResponse"

  /coop/parties/{id}/invite:
    post:
      operationId: inviteToCoopParty
      tags: [coop]
      summary: Invite a player to the co-op party
      parameters:
        - $ref: "#/components/parameters/PartyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCoopInput"
      responses:
        "200":
          description: Invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartyResponse"

  /coop/parties/{id}/accept:
    post:
      operationId: acceptCoopInvite
      tags: [coop]
      summary: Accept an invite to a co-op party
      parameters:
        - $ref: "#/components/parameters/PartyId"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartyResponse"

  /coop/parties/{id}/decline:
    post:
      operationId: declineCoopInvite
      tags: [coop]
      summary: Decline an invite to a co-op party
      parameters:
        - $ref: "#/components/parameters/PartyId"
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"

  /coop/parties/{id}/ready:
    post:
      operationId: setCoopReady
      tags: [coop]
      summary: Toggle the caller's ready flag in the party
      parameters:
        - $ref: "#/components/parameters/PartyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopReadyInput"
      responses:
        "200":
          description: Updated party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartyResponse"

  /coop/parties/{id}/start:
    post:
      operationId: startCoopRun
      tags: [coop]
      summary: Host launches the shared co-op run
      parameters:
        - $ref: "#/components/parameters/PartyId"
      responses:
        "200":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopRunStarted"

  /coop/leave:
    post:
      operationId: leaveCoopParty
      tags: [coop]
      summary: Leave the caller's current co-op party
      responses:
        "200":
          description: Left
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"

  /duels/active:
    get:
      operationId: getActiveDuel
      tags: [duel]
      summary: Get the caller's live or most recent duel (or null)
      responses:
        "200":
          description: Current duel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuelResponse"

  /duels/record:
    get:
      operationId: getDuelRecord
      tags: [duel]
      summary: Get the caller's durable win/loss record and recent duels
      responses:
        "200":
          description: Duel record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuelRecord"

  /duels/challenge:
    post:
      operationId: challengeDuel
      tags: [duel]
      summary: Challenge an encountered player to a PvP duel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeDuelInput"
      responses:
        "200":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuelResponse"

  /duels/{id}:
    get:
      operationId: getDuel
      tags: [duel]
      summary: Get a duel's full detail (incl. resolved result) for playback
      parameters:
        - $ref: "#/components/parameters/DuelId"
      responses:
        "200":
          description: Duel detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuelResponse"

  /duels/{id}/accept:
    post:
      operationId: acceptDuel
      tags: [duel]
      summary: Accept a pending duel challenge (resolves the fight server-side)
      parameters:
        - $ref: "#/components/parameters/DuelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptDuelInput"
      responses:
        "200":
          description: Duel accepted and resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuelResponse"

  /duels/{id}/decline:
    post:
      operationId: declineDuel
      tags: [duel]
      summary: Decline a pending duel challenge
      parameters:
        - $ref: "#/components/parameters/DuelId"
      responses:
        "200":
          description: Duel declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuelResponse"

  /duels/{id}/cancel:
    post:
      operationId: cancelDuel
      tags: [duel]
      summary: Cancel a still-pending duel challenge
      parameters:
        - $ref: "#/components/parameters/DuelId"
      responses:
        "200":
          description: Duel cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuelResponse"

  /duels/{id}/complete:
    post:
      operationId: completeDuel
      tags: [duel]
      summary: Mark a resolved duel as finished after leaving the arena
      parameters:
        - $ref: "#/components/parameters/DuelId"
      responses:
        "200":
          description: Duel completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuelResponse"

components:
  parameters:
    LabyrinthId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PlayerItemId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    TradeId:
      name: id
      in: path
      required: true
      schema:
        type: string
    PartyId:
      name: id
      in: path
      required: true
      schema:
        type: string
    DuelId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ListingId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    TradeCurrency:
      type: object
      properties:
        gold:
          type: integer
        ore:
          type: integer
        dust:
          type: integer
        keys:
          type: integer
        labToken:
          type: integer
      required: [gold, ore, dust, keys, labToken]

    TradeOfferItem:
      type: object
      properties:
        playerItemId:
          type: integer
        templateKey:
          type: string
        name:
          type: string
        icon:
          type: string
        rarity:
          type: string
        slot:
          type: string
        level:
          type: integer
        value:
          type: integer
      required:
        - playerItemId
        - templateKey
        - name
        - icon
        - rarity
        - slot
        - level
        - value

    TradeSide:
      type: object
      properties:
        userId:
          type: integer
        displayName:
          type: string
        avatarUrl:
          type: string
        confirmed:
          type: boolean
        currency:
          $ref: "#/components/schemas/TradeCurrency"
        items:
          type: array
          items:
            $ref: "#/components/schemas/TradeOfferItem"
      required:
        - userId
        - displayName
        - avatarUrl
        - confirmed
        - currency
        - items

    TradeSession:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, active, settled, cancelled, declined]
        version:
          type: integer
        role:
          type: string
          enum: [initiator, recipient]
        me:
          $ref: "#/components/schemas/TradeSide"
        them:
          $ref: "#/components/schemas/TradeSide"
        bothConfirmed:
          type: boolean
        note:
          type: string
          nullable: true
        updatedAt:
          type: string
      required:
        - id
        - status
        - version
        - role
        - me
        - them
        - bothConfirmed
        - note
        - updatedAt

    TradeEnvelope:
      type: object
      properties:
        trade:
          $ref: "#/components/schemas/TradeSession"
      required: [trade]

    TradeActiveEnvelope:
      type: object
      properties:
        trade:
          oneOf:
            - $ref: "#/components/schemas/TradeSession"
            - type: "null"
          nullable: true
      required: [trade]

    TradeInviteInput:
      type: object
      properties:
        toUserId:
          type: integer
      required: [toUserId]

    TradeRespondInput:
      type: object
      properties:
        accept:
          type: boolean
      required: [accept]

    TradeOfferInput:
      type: object
      properties:
        itemIds:
          type: array
          items:
            type: integer
        currency:
          $ref: "#/components/schemas/TradeCurrency"
      required: [itemIds, currency]

    TradeConfirmInput:
      type: object
      properties:
        confirmed:
          type: boolean
      required: [confirmed]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    IdempotentInput:
      type: object
      required: [idempotencyKey]
      properties:
        idempotencyKey:
          type: string
          minLength: 1

    MarketplaceListing:
      type: object
      required:
        - id
        - priceCents
        - feeCents
        - status
        - sellerUserId
        - sellerName
        - sellerAvatarUrl
        - isOwn
        - playerItemId
        - item
        - createdAt
      properties:
        id:
          type: integer
        priceCents:
          type: integer
          description: Listing price in integer USDC cents.
        feeCents:
          type: integer
          description: Marketplace fee in USDC cents deducted from seller proceeds on sale.
        status:
          type: string
          description: active | sold | cancelled
        sellerUserId:
          type: integer
        sellerName:
          type: string
        sellerAvatarUrl:
          type: string
        isOwn:
          type: boolean
          description: True when the viewing player owns this listing.
        playerItemId:
          type: integer
        item:
          $ref: "#/components/schemas/MarketplaceItem"
        createdAt:
          type: string

    MarketplaceItem:
      type: object
      required: [id, template, level, value]
      properties:
        id:
          type: integer
        template:
          $ref: "#/components/schemas/ItemTemplate"
        level:
          type: integer
        value:
          type: integer
        stats:
          $ref: "#/components/schemas/ItemStats"

    UsdcDepositInput:
      type: object
      required: [idempotencyKey, amountCents]
      properties:
        idempotencyKey:
          type: string
          minLength: 1
        amountCents:
          type: integer
          description: USDC amount to credit, in integer cents.

    UsdcDepositResult:
      type: object
      required: [balances]
      properties:
        balances:
          $ref: "#/components/schemas/Balances"

    CreateListingInput:
      type: object
      required: [idempotencyKey, playerItemId, priceCents]
      properties:
        idempotencyKey:
          type: string
          minLength: 1
        playerItemId:
          type: integer
        priceCents:
          type: integer
          description: Listing price in integer USDC cents.

    CreateListingResult:
      type: object
      required: [listing]
      properties:
        listing:
          $ref: "#/components/schemas/MarketplaceListing"

    CancelListingResult:
      type: object
      required: [ok, listingId]
      properties:
        ok:
          type: boolean
        listingId:
          type: integer

    BuyListingResult:
      type: object
      required: [listingId, playerItemId, pricePaidCents, feeCents, balances]
      properties:
        listingId:
          type: integer
        playerItemId:
          type: integer
        pricePaidCents:
          type: integer
        feeCents:
          type: integer
        balances:
          $ref: "#/components/schemas/Balances"

    Material:
      type: object
      required: [key, name, amount]
      properties:
        key:
          type: string
        name:
          type: string
        amount:
          type: integer
        icon:
          type: string

    Balances:
      type: object
      required: [gold, ore, dust, keys, labToken, usdc, materials]
      properties:
        gold:
          type: integer
        ore:
          type: integer
        dust:
          type: integer
        keys:
          type: integer
        labToken:
          type: integer
        usdc:
          type: integer
          description: USDC balance in integer cents (mock on-ramp until real on-chain USDC lands).
        materials:
          type: array
          items:
            $ref: "#/components/schemas/Material"

    MockWallet:
      type: object
      required: [walletAddress, displayName, avatarUrl, isPrimary]
      properties:
        walletAddress:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        isPrimary:
          type: boolean
        tagline:
          type: string

    AuthChallengeInput:
      type: object
      required: [walletAddress, chainId]
      properties:
        walletAddress:
          type: string
          minLength: 1
        chainId:
          type: integer
          enum: [4663, 46630]

    AuthChallenge:
      type: object
      required: [walletAddress, chainId, nonce, expiresAt, message]
      properties:
        walletAddress:
          type: string
        chainId:
          type: integer
        nonce:
          type: string
        expiresAt:
          type: string
        message:
          type: string

    AuthVerifyInput:
      type: object
      required: [walletAddress, chainId, message, signature]
      properties:
        walletAddress:
          type: string
          minLength: 1
        chainId:
          type: integer
          enum: [4663, 46630]
        message:
          type: string
          minLength: 1
        signature:
          type: string
          minLength: 1

    AuthConfig:
      type: object
      required:
        [network, environment, chainId, chainIdHex, rpcUrl, explorerUrl,
         nativeCurrency, settlementMode, tokenContracts, treasuryAddress,
         mockWalletAuthEnabled]
      properties:
        network:
          type: string
        environment:
          type: string
          enum: [mainnet, testnet]
        chainId:
          type: integer
        chainIdHex:
          type: string
        rpcUrl:
          type: string
          format: uri
        explorerUrl:
          type: string
          format: uri
        nativeCurrency:
          type: object
          required: [name, symbol, decimals]
          properties:
            name:
              type: string
            symbol:
              type: string
            decimals:
              type: integer
        settlementMode:
          type: string
          enum: [custodial_ledger, onchain]
        tokenContracts:
          type: object
          required: [labToken, usdc]
          properties:
            labToken:
              type: ["string", "null"]
            usdc:
              type: ["string", "null"]
        treasuryAddress:
          type: ["string", "null"]
        mockWalletAuthEnabled:
          type: boolean

    Player:
      type: object
      required:
        - id
        - walletAddress
        - displayName
        - avatarUrl
        - balances
        - ownedLabyrinthId
        - createdAt
      properties:
        id:
          type: integer
        walletAddress:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        tagline:
          type: ["string", "null"]
        balances:
          $ref: "#/components/schemas/Balances"
        ownedLabyrinthId:
          type: ["integer", "null"]
        createdAt:
          type: string

    LabyrinthClaimInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        biome:
          type: string

    LabyrinthUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        biome:
          type: string

    Labyrinth:
      type: object
      required:
        - id
        - ownerUserId
        - ownerName
        - ownerAvatarUrl
        - name
        - description
        - biome
        - level
        - depth
        - chamberCount
        - rareNodeCount
        - published
        - tollGateUnlocked
        - entryFee
        - ratingAverage
        - ratingCount
        - runsToday
        - runsAllTime
        - rewardValueToday
        - dailyRunCapacity
        - dailyRewardCapacity
        - appealScore
        - bossActive
        - isOwner
        - createdAt
      properties:
        id:
          type: integer
        ownerUserId:
          type: integer
        ownerName:
          type: string
        ownerAvatarUrl:
          type: string
        name:
          type: string
        description:
          type: string
        biome:
          type: string
        level:
          type: integer
        depth:
          type: integer
        chamberCount:
          type: integer
        rareNodeCount:
          type: integer
        published:
          type: boolean
        tollGateUnlocked:
          type: boolean
        entryFee:
          type: integer
        ratingAverage:
          type: number
        ratingCount:
          type: integer
        runsToday:
          type: integer
        runsAllTime:
          type: integer
        rewardValueToday:
          type: integer
        dailyRunCapacity:
          type: integer
        dailyRewardCapacity:
          type: integer
        appealScore:
          type: integer
        bossActive:
          type: boolean
        isOwner:
          type: boolean
        accentColor:
          type: string
        createdAt:
          type: string

    LabyrinthOrNull:
      oneOf:
        - $ref: "#/components/schemas/Labyrinth"
        - type: "null"

    LootTableEntry:
      type: object
      required: [kind, label, rarity, chance, minValue, maxValue]
      properties:
        kind:
          type: string
          enum: [currency, material, item]
